name: CMDB PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cmdb-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run project checks
        run: bash .github/scripts/cmdb-pr-checks.sh

